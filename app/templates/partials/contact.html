<section class="section" id="contact">
  <div class="section-inner">
    <div class="section-header reveal">
      <div class="section-eyebrow">Contact</div>
      <h2 class="section-heading">Let's talk</h2>
      <p class="section-lede">Reach out directly, or use the form — it goes straight to me.</p>
    </div>

    <div class="contact-layout">
      <div class="contact-info reveal">
        <a class="contact-info__row" href="mailto:{{ profile.email }}">
          <span class="contact-info__label">Email</span>
          <span class="contact-info__value">{{ profile.email }}</span>
        </a>
        <a class="contact-info__row" href="tel:{{ profile.phone | replace(' ', '') }}">
          <span class="contact-info__label">Phone</span>
          <span class="contact-info__value">{{ profile.phone }}</span>
        </a>
        <a class="contact-info__row" href="{{ profile.github_url }}" target="_blank" rel="noopener noreferrer">
          <span class="contact-info__label">GitHub</span>
          <span class="contact-info__value">{{ profile.github_display }}</span>
        </a>
        <a class="contact-info__row" href="{{ profile.linkedin_url }}" target="_blank" rel="noopener noreferrer">
          <span class="contact-info__label">LinkedIn</span>
          <span class="contact-info__value">{{ profile.linkedin_display }}</span>
        </a>
      </div>

      <form class="contact-form reveal" id="contact-form" novalidate>
        <div class="contact-form__field">
          <label for="cf-name">Name</label>
          <input type="text" id="cf-name" name="name" required minlength="1" maxlength="100" autocomplete="name" />
        </div>

        <div class="contact-form__field">
          <label for="cf-email">Email</label>
          <input type="email" id="cf-email" name="email" required autocomplete="email" aria-describedby="cf-email-hint" />
          <p class="contact-form__hint" id="cf-email-hint" aria-live="polite"></p>
        </div>

        <div class="contact-form__field">
          <label for="cf-message">Message (optional)</label>
          <textarea id="cf-message" name="message" rows="5" maxlength="2000"></textarea>
        </div>

        <!-- Honeypot: invisible and unreachable for real visitors (off-screen,
             not display:none — some bots specifically skip hidden fields).
             See app/models/contact.py and contact_service.py for the
             server-side half of this. -->
        <div class="hp-field" aria-hidden="true">
          <label for="cf-website">Website</label>
          <input type="text" id="cf-website" name="website" tabindex="-1" autocomplete="off" />
        </div>

        <button type="submit" class="btn btn--primary contact-form__submit">
          <span class="contact-form__submit-text">Send message</span>
        </button>

        <p class="live-region" id="contact-form-status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </div>
</section>
