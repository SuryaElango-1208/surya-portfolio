<footer class="footer">
  <div class="section-inner footer__inner">
    <p class="footer__mark">{{ profile.name }}</p>

    <p class="footer__meta">
      © {{ current_year }} · Built with FastAPI, Jinja2, and vanilla JS — no framework, no template.
    </p>

    <div class="footer__links">
      <a href="{{ profile.github_url }}" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a href="{{ profile.linkedin_url }}" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      <a href="mailto:{{ profile.email }}">Email</a>
    </div>
  </div>
</footer>
